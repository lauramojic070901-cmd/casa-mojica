<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Mojica - Sistema</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F3F0;color:#1A1714;font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
textarea,input{font-family:inherit}
#nav{position:fixed;top:0;left:0;right:0;z-index:100;background:#fff;border-bottom:1px solid #E0DBD5;display:flex;align-items:center;padding:0 12px;height:52px;gap:4px}
.logo{font-weight:700;font-size:15px;margin-right:8px;white-space:nowrap;color:#7A1A1A}
.tab{padding:7px 12px;border-radius:8px;border:none;background:none;color:#888;font-size:14px;font-weight:500}
.tab:hover{background:#F0EDE8}
.tab.on{background:#7A1A1A;color:#fff}
.nbadge{background:#E53E3E;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;margin-left:3px;display:none}
#app{padding-top:52px}
.vista{display:none;padding:16px;max-width:980px;margin:0 auto}
.vista.on{display:block}
.lbl{font-size:11px;font-weight:700;color:#AAA;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:8px;margin-top:16px}
.lbl:first-child{margin-top:0}
.m-layout{display:grid;grid-template-columns:1fr 330px;gap:16px}
@media(max-width:720px){.m-layout{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;border:1px solid #DDD;background:#fff;font-size:13px;font-weight:500}
.chip.on{background:#7A1A1A;color:#fff;border-color:#7A1A1A}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.mbtn{aspect-ratio:1;border-radius:8px;border:1px solid #DDD;background:#fff;font-size:13px;font-weight:600;position:relative}
.mbtn.on{background:#7A1A1A;color:#fff;border-color:#7A1A1A}
.mbtn.ocupada{background:#FDF3E3;border-color:#F0D49A;color:#C17B2A}
.mbtn.on.ocupada{background:#7A1A1A;color:#fff}
.mdot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#C17B2A}
.cat-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{padding:5px 11px;border-radius:16px;border:1px solid #DDD;background:#fff;font-size:12px;font-weight:500;color:#666}
.cat-tab.on{background:#7A1A1A;color:#fff;border-color:#7A1A1A}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
.mcard{padding:10px 11px;border-radius:10px;border:1px solid #DDD;background:#fff;text-align:left}
.mcard:hover{border-color:#AAA;background:#F8F6F3}
.mcard:active{transform:scale(0.97)}
.mcard-cat{font-size:10px;font-weight:700;color:#AAA;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:3px}
.mcard-n{font-size:13px;font-weight:500;display:block;margin-bottom:3px}
.mcard-p{font-size:12px;color:#7A1A1A;font-weight:600}
.mcard.especial{border-color:#C17B2A;background:#FFFBF5}
.mcard.especial .mcard-cat{color:#C17B2A}
.cart{background:#fff;border:1px solid #DDD;border-radius:12px;padding:14px;position:sticky;top:68px;max-height:calc(100vh - 80px);overflow-y:auto}
.cart-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cart-h h3{font-size:15px;font-weight:600}
.cart-sub{font-size:12px;color:#AAA}
.cart-empty{font-size:13px;color:#BBB;padding:14px 0;text-align:center}
.citem{padding:8px 0;border-bottom:1px solid #F0EDE8;font-size:13px}
.citem:last-child{border:none}
.citem-top{display:flex;align-items:center;gap:7px}
.citem-n{flex:1;font-weight:500}
.citem-det{font-size:12px;color:#888;margin-top:3px;padding-left:2px;line-height:1.5}
.qc{display:flex;align-items:center;gap:6px}
.qbtn{width:24px;height:24px;border-radius:50%;border:1px solid #DDD;background:#F5F3F0;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.qn{min-width:16px;text-align:center;font-weight:600;font-size:13px}
.nota-gen{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #DDD;background:#F5F3F0;font-size:13px;resize:none;margin:10px 0}
.nota-gen:focus{outline:none;border-color:#AAA}
.cart-tot{display:flex;justify-content:space-between;font-weight:600;font-size:16px;padding:10px 0;border-top:1px solid #EEE;margin-bottom:10px}
.btn-env{width:100%;padding:12px;border-radius:10px;background:#7A1A1A;color:#fff;border:none;font-size:15px;font-weight:600}
.btn-env:disabled{opacity:0.3;cursor:not-allowed}
.pmin{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;background:#F5F3F0;margin-bottom:5px;font-size:13px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px}
.p-preparando{background:#E8F0FA;color:#2A5C9A}
.p-entregado{background:#F0EDE8;color:#AAA}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px}
.modal-titulo{font-size:17px;font-weight:700;margin-bottom:4px}
.modal-precio{font-size:13px;color:#7A1A1A;font-weight:600;margin-bottom:16px}
.modal-sec{margin-bottom:16px}
.modal-sec-label{font-size:12px;font-weight:700;color:#AAA;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.op-btn{padding:7px 13px;border-radius:20px;border:1px solid #DDD;background:#fff;font-size:13px;font-weight:500;color:#444}
.op-btn.on{background:#7A1A1A;color:#fff;border-color:#7A1A1A}
.op-input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #DDD;background:#F5F3F0;font-size:13px;margin-top:6px}
.op-input:focus{outline:none;border-color:#AAA}
.especial-box{background:#FFFBF5;border:1px solid #F0D49A;border-radius:8px;padding:10px 12px;margin-top:6px;font-size:13px;color:#888}
.especial-box strong{color:#C17B2A;display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em}
.modal-footer{display:flex;gap:8px;margin-top:20px;border-top:1px solid #EEE;padding-top:16px}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid #DDD;background:#fff;font-size:14px;font-weight:500;color:#666}
.btn-confirm{flex:2;padding:11px;border-radius:10px;border:none;background:#7A1A1A;color:#fff;font-size:14px;font-weight:600}
.btn-confirm:disabled{opacity:0.35;cursor:not-allowed}
/* COCINA */
.kcols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.kcols{grid-template-columns:1fr}}
.ticket{background:#fff;border:1px solid #DDD;border-radius:10px;padding:11px;margin-bottom:9px}
.tk-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.tk-mesa{font-size:16px;font-weight:700}
.tk-msero{font-size:11px;color:#AAA;margin-top:1px}
.tk-t{font-size:12px;color:#AAA;background:#F5F3F0;padding:2px 7px;border-radius:10px}
.tk-t.urg{background:#FDE8E8;color:#C13030}
.tk-sep{border:none;border-top:1px dashed #DDD;margin:7px 0}
.tk-pl{font-size:13px;padding:2px 0}
.tk-pl-n{font-weight:600}
.tk-pl-det{font-size:12px;color:#555;margin-top:2px;line-height:1.5;padding-left:8px;border-left:2px solid #EEE;margin-left:2px;margin-bottom:4px}
.tk-nota{font-size:12px;color:#888;font-style:italic;margin-top:5px;padding:4px 8px;background:#FDF3E3;border-radius:6px}
.k-empty{text-align:center;padding:50px 0;color:#BBB;font-size:14px}
/* CAJA */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:580px){.mets{grid-template-columns:repeat(2,1fr)}}
.met{background:#fff;border:1px solid #DDD;border-radius:10px;padding:12px 14px}
.met.alerta{border-color:#F0A8A8;background:#FDE8E8}
.met-l{font-size:12px;color:#888;margin-bottom:5px}
.met-v{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.met.alerta .met-v{color:#C13030}
.stabs{display:flex;border-bottom:1px solid #DDD;margin-bottom:16px}
.stab{padding:9px 14px;border:none;background:none;font-size:14px;font-weight:500;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab.on{color:#1A1714;border-bottom-color:#1A1714}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ccard{background:#fff;border:1px solid #DDD;border-radius:10px;padding:13px}
.ccard-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ccard-m{font-size:17px;font-weight:700}
.ccard-ms{font-size:12px;color:#AAA}
.ccard-pl{font-size:13px;color:#888;margin-bottom:8px;line-height:1.6}
.ccard-f{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #EEE;padding-top:9px}
.ccard-tot{font-size:17px;font-weight:700}
.btn-cer{padding:7px 13px;border-radius:7px;background:#7A1A1A;color:#fff;border:none;font-size:13px;font-weight:600}
/* INVENTARIO */
.itbl{background:#fff;border:1px solid #DDD;border-radius:10px;overflow:hidden}
.irow-h{display:grid;grid-template-columns:1.6fr 1.3fr 0.8fr 1.6fr;padding:9px 14px;background:#F5F3F0;font-size:11px;font-weight:700;color:#AAA;text-transform:uppercase;letter-spacing:0.05em}
.irow{display:grid;grid-template-columns:1.6fr 1.3fr 0.8fr 1.6fr;padding:10px 14px;align-items:center;border-top:1px solid #EEE;font-size:13px}
.irow.bajo{background:#FDE8E8}
.ibar-t{width:100%;height:5px;background:#EEE;border-radius:3px;margin-bottom:3px}
.ibar-f{height:5px;border-radius:3px}
.ist{font-size:12px;color:#888}
.imin{font-size:12px;color:#AAA}
.inv-add{display:flex;gap:6px;align-items:center}
.inv-num{width:60px;padding:5px 7px;border-radius:6px;border:1px solid #DDD;background:#fff;font-size:13px;text-align:center}
.btn-add{padding:5px 10px;border-radius:6px;border:none;background:#2A7A4B;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.btn-sal{background:#7A1A1A}
.rec-card{padding:10px 4px;border-top:1px solid #EEE}
.rec-card.on{background:#FAF8F5;padding:10px;border-radius:10px;border:1px solid #E5E0D8;margin:6px 0}
.rec-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.rec-fila{display:flex;align-items:center;gap:6px;margin-top:8px}
.rec-fila select{flex:1;min-width:0;padding:7px;border:1px solid #DDD;border-radius:8px;font-size:13px;background:#fff}
.rec-fila input{width:72px;padding:7px;border:1px solid #DDD;border-radius:8px;font-size:13px}
.rec-acc{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn-unid{margin-left:4px;padding:1px 6px;border-radius:5px;border:1px solid #DDD;background:#F5F3F0;font-size:11px;color:#666;cursor:pointer}
.inv-acc{margin-bottom:6px}
.btn-inv-big{width:100%;padding:13px;border-radius:10px;border:none;background:#7A1A1A;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.inv-ayuda{font-size:12px;color:#888;margin-top:8px;line-height:1.4}
.vm-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-top:1px solid #EEE;font-size:14px}
.vm-row.on{background:#EEF7F1}
.vm-ctl{display:flex;align-items:center;gap:4px}
.vm-ctl button{width:34px;height:34px;border-radius:8px;border:1px solid #DDD;background:#fff;font-size:18px;font-weight:700}
.vm-ctl input{width:52px;height:34px;text-align:center;border:1px solid #DDD;border-radius:8px;font-size:15px}
/* REPORTES */
.rblock{background:#fff;border:1px solid #DDD;border-radius:10px;padding:14px;margin-bottom:14px}
.rblock h3{font-size:14px;font-weight:600;margin-bottom:12px}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.blbl{font-size:13px;min-width:130px}
.btrk{flex:1;height:9px;background:#F0EDE8;border-radius:4px}
.bfill{height:9px;background:#7A1A1A;border-radius:4px}
.bnum{font-size:13px;font-weight:600;min-width:22px;text-align:right}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #EEE;font-size:13px}
.hrow:last-child{border:none}
.hmeta{color:#AAA;font-size:12px;margin-top:1px}
.empty{text-align:center;padding:40px 0;color:#BBB;font-size:14px}
/* PRINT */
.pi-ticket{font-family:monospace;font-size:13px}
.pi-titulo{font-size:15px;font-weight:bold;text-align:center;margin-bottom:2px}
.pi-sub{font-size:11px;text-align:center;margin-bottom:6px}
.pi-mesa{font-size:20px;font-weight:bold;text-align:center;margin:4px 0}
.pi-info{font-size:11px;margin-bottom:4px}
.pi-sep{border-top:1px dashed #888;margin:6px 0}
.pi-item{display:flex;padding:3px 0;font-size:13px}
.pi-qty{font-weight:bold;min-width:22px}
.pi-nombre{flex:1;padding:0 4px}
.pi-precio{font-weight:bold;white-space:nowrap}
.pi-det{font-size:11px;color:#444;padding:1px 0 1px 22px}
.pi-nota-p{font-size:12px;font-weight:bold;margin-top:6px;padding:4px;border:1px solid #000}
.pi-total{display:flex;justify-content:space-between;font-size:15px;font-weight:bold;margin-top:6px;padding-top:6px;border-top:2px solid #000}
.pi-pie{text-align:center;font-size:11px;margin-top:6px}
.pi-cliente.pi-corte{margin-top:16px;border-top:2px dashed #000;padding-top:16px}
@page{margin:0}
.solo-impresion{display:none}
.est-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;border:1px solid #DDD;background:#fff}
.est-bar.on{background:#EEF7F1;border-color:#9CCFB0;color:#1F5C38;font-weight:600}
.est-bar button{padding:7px 12px;border-radius:8px;border:1px solid #CCC;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  #nav,#app,#modal-almuerzo,#toast,.pi-head,.pi-btn{display:none!important}
  #print-overlay{position:static!important;inset:auto!important;background:none!important;display:block!important;padding:0!important}
  #print-overlay>div{box-shadow:none!important;border-radius:0!important;padding:0!important;max-width:none!important;width:64mm!important;margin:0 auto!important;box-sizing:border-box!important;max-height:none!important;overflow:visible!important}
  .pi-ticket{color:#000!important;overflow-wrap:anywhere}
  .pi-corte{break-before:page;page-break-before:always;margin-top:0!important;border-top:none!important;padding-top:0!important}
  .pi-sep{border-top:1px dashed #000;margin:8px 0}
  /* COCINA: letra grande */
  .pi-cocina .pi-titulo{font-size:22px}
  .pi-cocina .pi-mesa{font-size:34px;margin:6px 0}
  .pi-cocina .pi-info{font-size:16px}
  .pi-cocina .pi-item{font-size:22px;font-weight:bold;padding:5px 0}
  .pi-cocina .pi-qty{min-width:38px}
  .pi-cocina .pi-det{font-size:18px;color:#000;padding:2px 0 2px 38px}
  .pi-cocina .pi-nota-p{font-size:19px;padding:6px;border:2px solid #000}
  /* CLIENTE: letra mediana */
  .pi-cliente .pi-titulo{font-size:20px}
  .pi-cliente .pi-sub{font-size:13px}
  .pi-cliente .pi-info{font-size:14px}
  .pi-cliente .pi-item{font-size:16px;padding:4px 0}
  .pi-cliente .pi-qty{min-width:30px}
  .pi-cliente .pi-total{font-size:20px}
  .pi-cliente .pi-pie{font-size:13px}
}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A1714;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity 0.2s;z-index:999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<nav id="nav">
  <span class="logo">🍽 Casa Mojica</span>
  <button class="tab on" id="tab-mesero" onclick="irA('mesero')">Mesero</button>
  <button class="tab" id="tab-cocina" onclick="irA('cocina')">Cocina<span class="nbadge" id="badge">0</span></button>
  <button class="tab" id="tab-caja" onclick="irA('caja')">Caja</button>
</nav>
<div id="app">
  <div class="vista on" id="v-mesero"></div>
  <div class="vista" id="v-cocina"></div>
  <div class="vista" id="v-caja"></div>
</div>
<div id="modal-almuerzo" style="display:none" class="modal-overlay" onclick="cerrarModalSiOverlay(event)">
  <div class="modal" id="modal-contenido"></div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ── CONFIGURACIÓN ──────────────────────────────────────
var MESEROS = ['Mesero 1','Mesero 2','Mesero 3','Mesero 4'];
var N_MESAS = 75;
var JUGOS = ['Zumo de limón','Panelada','Piña','Tomate de árbol','Mora','Otro (anotar)'];
var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
// Especial sugerido por día (el mesero puede cambiarlo)
var ESPECIAL_SUGERIDO = {0:'',1:'Chuleta',2:'Lasaña',3:'Frijolada',4:'Ajiaco',5:'Especial Internacional',6:''};
var CATEGORIAS = ['Todos','Almuerzos','Desayunos','Sándwiches','Pescados','Carnes','Pollo y Cerdo'];

// ── MENÚ ───────────────────────────────────────────────
// Inventario: cantidades en kg o unidades POR PORCIÓN (extraídas del Excel)
var MENU = [
  // ALMUERZOS
  {id:'casero',    n:'Almuerzo Casero',    p:20000, cat:'Almuerzos', tipo:'casero',
   ing:{cerdo:0.15, arroz:0.059, papa_blanca:0.15, lechuga:0.02, tomate:0.02}},
  {id:'ejecutivo', n:'Almuerzo Ejecutivo', p:25000, cat:'Almuerzos', tipo:'ejecutivo',
   ing:{res:0.15, arroz:0.059, papa_blanca:0.1, lechuga:0.02, tomate:0.02}},
  // DESAYUNOS
  {id:'w_omelet',     n:'Western Omelet',       p:15000, cat:'Desayunos', ing:{huevo:2, cebolla:0.02, pimenton:0.02}},
  {id:'omel_veg',     n:'Omelette Vegetales',  p:15000, cat:'Desayunos', ing:{huevo:2}},
  {id:'omel_ranch',   n:'Omelette Ranchero',   p:18000, cat:'Desayunos', ing:{huevo:2, jamon:0.03}},
  {id:'omel_cri',     n:'Omelette Criollo',    p:18000, cat:'Desayunos', ing:{huevo:2, res:0.08}},
  {id:'omel_pol',     n:'Omelette Pollo',      p:18000, cat:'Desayunos', ing:{huevo:2, pollo:0.1}},
  {id:'huevos_gusto', n:'Huevos al Gusto',     p:4500,  cat:'Desayunos', variable:true, ing:{huevo:2}},
  {id:'caldo_cos',    n:'Caldo de Costilla',   p:12000,  cat:'Desayunos', ing:{costilla:0.2}},
  {id:'caldo_pes',    n:'Caldo de Pescado',    p:15000, cat:'Desayunos', ing:{pescado:0.2}},
  {id:'changua',      n:'Changua Especial',    p:15000, cat:'Desayunos', ing:{leche:0.2, huevo:1}},
  {id:'monona',       n:'Moñona',              p:18000, cat:'Desayunos', ing:{res:0.15, huevo:1, arroz:0.059}},
  {id:'calentado',    n:'Calentado Paisa',     p:18000, cat:'Desayunos', ing:{arroz:0.059, huevo:1, frijol:0.05}},
  {id:'desayuno_casa',n:'Desayuno de la Casa', p:20000, cat:'Desayunos', ing:{costilla:0.15, huevo:1}},
  {id:'tamales',      n:'Tamal con Chocolate, Café o Jugo',             p:14000,     cat:'Desayunos', ing:{}},

function selMesero(i){meseroIdx=i;renderMesero();}
function selCat(c){catSel=c;renderMesero();}
function selMesa(n){if(mesaSel===n){mesaSel=null;carrito=[];}else{mesaSel=n;}renderMesero();}
function precioItem(it){if(it&&it.p!=null)return it.p;var d=MENU.find(function(m){return m.id===it.id;});return d?d.p:0;}
function agregar(id){
  if(!mesaSel){toast('Selecciona una mesa primero');return;}
  var d=MENU.find(function(m){return m.id===id;});if(!d)return;
  if(d.p===0){toast('Precio a consultar — agrega la nota');return;}
  if(d.tipo==='casero'||d.tipo==='ejecutivo'){abrirModalAlmuerzo(d.tipo);return;}
  if(d.variable){abrirModalVariable(id);return;}
  var ex=carrito.find(function(i){return i.id===id;});
  if(ex){ex.qty++;}else{carrito.push({id:id,n:d.n,qty:1,detalle:''});}
  renderMesero();
}
function abrirModalVariable(id){
  var d=MENU.find(function(m){return m.id===id;});if(!d)return;
  var html='<div class="modal-titulo">'+d.n+'</div>'
    +'<div class="modal-precio">Desde $'+fmt(d.p)+'</div>'
    +'<div class="modal-sec"><div class="modal-sec-label">Precio</div>'
    +'<input class="op-input" id="var-precio" type="number" inputmode="numeric" min="'+d.p+'" step="500" value="'+d.p+'" style="font-size:18px;font-weight:600"></div>'
    +'<div class="modal-sec"><div class="modal-sec-label">¿Cómo los quiere? (para cocina)</div>'
    +'<textarea class="op-input" id="var-como" rows="2" placeholder="Ej: revueltos con tomate y cebolla"></textarea></div>'
    +'<div class="modal-footer">'
    +'<button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>'
    +'<button class="btn-confirm" onclick="confirmarVariable(\''+id+'\')">Agregar al pedido</button>'
    +'</div>';
  document.getElementById('modal-contenido').innerHTML=html;
  document.getElementById('modal-almuerzo').style.display='flex';
  var inp=document.getElementById('var-precio');if(inp){inp.focus();inp.select();}
}
function confirmarVariable(id){
  var d=MENU.find(function(m){return m.id===id;});if(!d)return;
  var val=parseInt(String(document.getElementById('var-precio').value).replace(/[^0-9]/g,''),10);
  if(!val||val<d.p){toast('El precio mínimo es $'+fmt(d.p));return;}
  var como=document.getElementById('var-como').value.trim();
  carrito.push({id:id,n:d.n,qty:1,detalle:como,p:val});
  cerrarModal();renderMesero();
  toast(d.n+' agregado ✓');
}
function qcambiar(idx,delta){
  carrito[idx].qty+=delta;
  if(carrito[idx].qty<=0)carrito.splice(idx,1);
  renderMesero();
}
function enviar(){
  if(!mesaSel||carrito.length===0)return;
  var notaEl=document.getElementById('nota-txt');
  var nota=notaEl?notaEl.value.trim():'';
  var p={id:'P'+Date.now()+Math.random().toString(36).slice(2,6),mesa:mesaSel,mesero:MESEROS[meseroIdx],items:JSON.parse(JSON.stringify(carrito)),estado:'preparando',nota:nota,ts:Date.now()};
  p=JSON.parse(JSON.stringify(p));
  // Descontar inventario con porciones reales (en la nube)
  var dec={};
  p.items.forEach(function(it){
    var d=MENU.find(function(m){return m.id===it.id;});if(!d)return;
    Object.keys(d.ing).forEach(function(ing){if(inv[ing])dec[ing]=(dec[ing]||0)+cantInv(ing,d.ing[ing]*it.qty);});
  });
  var batch=db.batch();
  batch.set(db.collection('pedidos').doc(p.id),p);
  var upd={};Object.keys(dec).forEach(function(k){upd[k]={s:FV.increment(-dec[k])};});
  if(Object.keys(upd).length)batch.set(db.collection('inventario').doc('stock'),upd,{merge:true});
  batch.set(db.collection('impresiones').doc(),{tipo:'pedido',pedido:p,ts:Date.now(),impreso:false});
  batch.commit().catch(function(e){console.error(e);toast('⚠ No se pudo enviar. Revisa el internet');});
  carrito=[];
  toast('Pedido mesa '+mesaSel+' enviado ✓ · imprimiendo');renderMesero();
}

// ── ESTACIÓN DE IMPRESIÓN ────────────────────────────────
// Un solo equipo (el que tiene la impresora) imprime todo lo que envían los celulares.
var unsubImp=null,colaImp=[],imprimiendo=false,vistosImp={};
function activarEstacion(on){
  esEstacion=!!on;lsSet('mj_estacion',esEstacion);
  if(unsubImp){unsubImp();unsubImp=null;}
  colaImp=[];vistosImp={};
  if(esEstacion){
    unsubImp=db.collection('impresiones').where('impreso','==',false).onSnapshot(function(snap){
      snap.docs.forEach(function(d){if(!vistosImp[d.id]){vistosImp[d.id]=true;colaImp.push({id:d.id,data:d.data()});}});
      colaImp.sort(function(a,b){return a.data.ts-b.data.ts;});
      procesarCola();
    },function(e){console.error(e);toast('⚠ Error en la estación de impresión');});
  }
  renderizar();
}
function procesarCola(){
  if(imprimiendo||colaImp.length===0)return;
  imprimiendo=true;
  var job=colaImp.shift();
  var ref=db.collection('impresiones').doc(job.id);
  db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      if(!doc.exists)return false;      // ya lo imprimió otro equipo
      t.delete(ref);return true;
    });
  }).then(function(ok){
    if(!ok)return;
    if(Date.now()-job.data.ts>3*3600000)return; // trabajos muy viejos no se imprimen
    var html=job.data.tipo==='pedido'?htmlTickets(job.data.pedido):htmlCuenta(job.data.mesa);
    if(html)imprimirDirecto(html);
  }).catch(function(e){console.error(e);delete vistosImp[job.id];})
  .then(function(){imprimiendo=false;procesarCola();});
}
function imprimirDirecto(html){
  var o=document.getElementById('print-overlay');if(o)o.remove();
  var div=document.createElement('div');
  div.id='print-overlay';div.className='solo-impresion';
  div.innerHTML='<div><div id="tickets-para-imprimir">'+html+'</div></div>';
  document.body.appendChild(div);
  window.print();
  div.remove();
}

function moverStock(id,signo){

  var batch=db.batch();
  batch.set(db.collection('inventario').doc('stock'),upd,{merge:true});
  batch.set(refMov(),{tipo:'mov',clase:signo>0?'entrada':'salida',ts:Date.now(),items:[{k:id,n:inv[id].n,cant:signo*cantidad,u:inv[id].u}]});

function guardarUnidad(){

  batch.commit()
    .then(function(){toast(inv[id].n+' ahora en '+UNIDADES[u]);})

function filasAIng(filas){var ing={};filas.forEach(function(f){if(inv[f[0]]&&f[1]>0)ing[f[0]]=Math.round(((ing[f[0]]||0)+f[1]*(inv[f[0]].eq||1))*10000)/10000;});return ing;}

function confirmarVentasManual(){
  var ids=Object.keys(ventasManual);
  if(!ids.length){toast('No has agregado platos');return;}
  var dec={};
  ids.forEach(function(id){
    var d=platoPorClave(id);if(!d)return;
    Object.keys(d.ing).forEach(function(k){if(inv[k])dec[k]=(dec[k]||0)+cantInv(k,d.ing[k]*ventasManual[id]);});
  });
  var upd={};Object.keys(dec).forEach(function(k){upd[k]={s:FV.increment(-dec[k])};});
  var n=totalVM();
  var batch=db.batch();
  batch.set(db.collection('inventario').doc('stock'),upd,{merge:true});
  batch.set(refMov(),{tipo:'mov',clase:'platos',ts:Date.now(),
    platos:ids.map(function(id){var d=platoPorClave(id);return {n:d?d.n:id,qty:ventasManual[id]};}),
    items:Object.keys(dec).map(function(k){return {k:k,n:inv[k].n,cant:-Math.round(dec[k]*1000)/1000,u:inv[k].u};})});
  batch.commit()
    .then(function(){toast('Listo: '+n+' platos descontados del inventario');})

    ks.forEach(function(k){var r=res[k],u=UNIDADES[r.u]||r.u;
      html+='<div class="hrow"><div>'+r.n+'</div><div style="text-align:right;font-size:13px">'
        +(r.ent?'<span style="color:#2A7A4B;font-weight:600">+'+fmtCant(r.ent,r.u)+' '+u+'</span> ':'')
        +(r.sal?'<span style="color:#C13030;font-weight:600">−'+fmtCant(r.sal,r.u)+' '+u+'</span>':'')+'</div></div>';});
  }
  html+='<div class="modal-sec-label" style="margin-top:14px">Detalle</div>';
  var nom={entrada:'Entrada',salida:'Salida',platos:'Platos vendidos',ajuste:'Ajuste de stock'};
  movs.forEach(function(m){
    var hora=new Date(m.ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
    var det;
    if(m.clase==='platos')det=(m.platos||[]).map(function(p){return p.qty+' '+p.n;}).join(', ');
    else if(m.clase==='ajuste')det=(m.items||[]).map(function(it){return it.n+' = '+fmtCant(it.cant,it.u)+' '+(UNIDADES[it.u]||it.u);}).join(', ');
    else det=(m.items||[]).map(function(it){return (it.cant>0?'+':'−')+fmtCant(Math.abs(it.cant),it.u)+' '+(UNIDADES[it.u]||it.u)+' '+it.n;}).join(', ');
    html+='<div class="hrow"><div><div>'+det+'</div><div class="hmeta">'+hora+' · '+nom[m.clase]+'</div></div></div>';
  });
  return html+'</div>';
}
function renderVentasRep(){
  if(historial.length===0)return '<div class="empty">Aún no hay ventas cerradas hoy.</div>';
  var pv={};
  historial.forEach(function(p){p.items.forEach(function(it){pv[it.n]=(pv[it.n]||0)+it.qty;});});
  var top=Object.keys(pv).map(function(k){return[k,pv[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var maxV=top.length?top[0][1]:1;
  var html='<div class="rblock"><h3>Platos más vendidos</h3>';
  top.forEach(function(r){html+='<div class="brow"><span class="blbl">'+r[0]+'</span><div class="btrk"><div class="bfill" style="width:'+((r[1]/maxV)*100)+'%"></div></div><span class="bnum">'+r[1]+'</span></div>';});
  html+='</div><div class="rblock"><h3>Últimas cuentas cerradas</h3>';
  historial.slice(-10).reverse().forEach(function(p){
    html+='<div class="hrow"><div><div>Mesa '+p.mesa+' · '+p.mesero+'</div><div class="hmeta">'+p.items.length+' plato'+(p.items.length!==1?'s':'')+'</div></div><strong>$'+fmt(p.total)+'</strong></div>';
  });
  html+='</div>';
  return html;
}

// ── UTILS ─────────────────────────────────────────────────
function fmt(n){return new Intl.NumberFormat('es-CO').format(Math.round(n));}
var toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},3000);}
function resetDemo(){if(!confirm('¿Reiniciar todos los datos?'))return;pedidos=[];inv=JSON.parse(JSON.stringify(INV0));historial=[];guardar();renderizar();toast('Datos reiniciados');}

// ── SINCRONIZACIÓN EN TIEMPO REAL ─────────────────────────
function inicioDia(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
var diaActual=inicioDia(),unsubHist=null;
db.collection('pedidos').onSnapshot(function(snap){
  pedidos=snap.docs.map(function(d){return d.data();});
  renderizar();
},function(e){console.error(e);toast('⚠ Sin conexión con la base de datos');});
function escucharHistorial(){
  if(unsubHist)unsubHist();
  unsubHist=db.collection('historial').where('ts','>=',diaActual).onSnapshot(function(snap){
    historial=snap.docs.map(function(d){return d.data();}).sort(function(a,b){return a.ts-b.ts;});
    renderizar();
  },function(e){console.error(e);});
}
escucharHistorial();
var movs=[],repDia=null,unsubMov=null;
function fechaISO(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function escucharMovs(){
  if(unsubMov)unsubMov();
  var ini=repDia?new Date(repDia+'T00:00:00').getTime():diaActual,fin=ini+86400000;
  unsubMov=db.collection('inventario').where('ts','>=',ini).where('ts','<',fin).onSnapshot(function(snap){
    movs=snap.docs.map(function(d){return d.data();}).filter(function(m){return m.tipo==='mov';}).sort(function(a,b){return b.ts-a.ts;});
    renderizar();
  },function(e){console.error(e);});
}
db.collection('inventario').doc('recetas').onSnapshot(function(doc){aplicarRecetas(doc.exists?doc.data():null);renderizar();},function(e){console.error(e);});
function cambiarDiaRep(v){repDia=v||null;escucharMovs();}
escucharMovs();
db.collection('inventario').doc('stock').onSnapshot(function(doc){
  if(!doc.exists){
    if(!doc.metadata.fromCache)db.collection('inventario').doc('stock').set(JSON.parse(JSON.stringify(INV0)));
    return;
  }
  var data=doc.data();
  inv=JSON.parse(JSON.stringify(INV0));
  Object.keys(data).forEach(function(k){
    if(!data[k])return;
    if(!inv[k]){ // insumo nuevo creado desde Caja
      if(!data[k].nuevo||!data[k].n)return;
      inv[k]={n:data[k].n,u:data[k].ub||'kg',ub:data[k].ub||'kg',s:0,m:0,cat:data[k].cat||'Otros',nuevo:true};
    }
    if(typeof data[k].s==='number')inv[k].s=Math.max(0,parseFloat(data[k].s.toFixed(3)));
    if(data[k].u&&UNIDADES[data[k].u])inv[k].u=data[k].u;
    if(typeof data[k].eq==='number'&&data[k].eq>0)inv[k].eq=data[k].eq;
    if(inv[k].u===baseU(k))inv[k].eq=1; // en su unidad original no hay conversión
    if(typeof data[k].m==='number')inv[k].m=data[k].m;
  });
  renderizar();
},function(e){console.error(e);});
setInterval(function(){
  if(inicioDia()!==diaActual){diaActual=inicioDia();escucharHistorial();}
  if(vistaActual==='cocina')renderCocina();
},30000);
if(esEstacion)activarEstacion(true);
renderizar();
</script>
